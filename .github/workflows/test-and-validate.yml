name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Ref to check out for reusable CI runs.
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION="1.7.7"
          BINARY="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${BINARY}"
          curl -sLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/checksum.txt"
          grep "${BINARY}" checksum.txt | sha256sum -c -
          tar xzf "${BINARY}" actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Run actionlint
        run: actionlint -color

      - name: Validate static checks
        run: pnpm ci:static

      - name: Test Unit
        run: pnpm test:unit

      - name: Test Admin Console
        run: pnpm test:admin

  # E2E runs concurrently with lint, typecheck, and unit tests. Browser specs
  # run separately so ordinary shards do not install Playwright dependencies.
  test-e2e-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type != 'tag'
    env:
      E2E_SHARD_COUNT: 4
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test E2E - Shard ${{ matrix.shard }}/${{ env.E2E_SHARD_COUNT }}
        env:
          CI: true
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:shardable --shard="$MATRIX_SHARD/$E2E_SHARD_COUNT" --reporter=minimal
          test_status=$?
          set -e
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "E2E shard $MATRIX_SHARD/$E2E_SHARD_COUNT took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

  test-e2e-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test background runtime E2E
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:system --reporter=minimal
          test_status=$?
          set -e
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "Background runtime E2E took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"
        env:
          CI: true

  test-e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type != 'tag'
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test browser E2E
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:browser --reporter=minimal
          test_status=$?
          set -e
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "Browser E2E took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"
        env:
          CI: true
