name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Ref to check out for reusable CI runs.
        required: false
        type: string
      run_e2e:
        description: Run the E2E test jobs.
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test Unit
        run: pnpm test:unit

      - name: Test Admin Console
        run: pnpm test:admin

  # E2E runs concurrently with lint, typecheck, and unit tests. Browser specs
  # run separately so ordinary shards do not install Playwright dependencies.
  test-e2e-parallel:
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' && (github.event_name != 'workflow_call' || inputs.run_e2e)
    env:
      E2E_SHARD_COUNT: 4
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test E2E - Shard ${{ matrix.shard }}/${{ env.E2E_SHARD_COUNT }}
        run: |
          started_at=$(date +%s)
          pnpm test:e2e:non-browser --shard=${{ matrix.shard }}/${{ env.E2E_SHARD_COUNT }} --reporter=minimal
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "E2E shard ${{ matrix.shard }}/${{ env.E2E_SHARD_COUNT }} took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
        env:
          CI: true

  test-e2e-browser:
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' && (github.event_name != 'workflow_call' || inputs.run_e2e)
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test browser E2E
        run: pnpm test:e2e:browser --reporter=minimal
        env:
          CI: true
