name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Ref to check out for reusable CI runs.
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          BINARY="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --connect-timeout 15 --retry 3 \
            -o "${BINARY}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${BINARY}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${BINARY}" | sha256sum -c -
          tar xzf "${BINARY}" actionlint
          command -v shellcheck >/dev/null || { echo "::error::shellcheck not found on runner"; exit 1; }
          echo "$PWD" >> "$GITHUB_PATH"
          ./actionlint -color

      - name: Validate static checks
        run: pnpm ci:static

      - name: Test Unit
        run: pnpm test:unit

      - name: Test Admin Console
        run: pnpm test:admin

  # E2E runs concurrently with lint, typecheck, and unit tests. Browser specs
  # run separately so ordinary shards do not install Playwright dependencies.
  test-e2e-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type != 'tag'
    env:
      E2E_SHARD_COUNT: 4
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test E2E - Shard ${{ matrix.shard }}/${{ env.E2E_SHARD_COUNT }}
        env:
          CI: true
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:shardable --shard="$MATRIX_SHARD/$E2E_SHARD_COUNT" --reporter=minimal
          test_status=$?
          set -e
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "E2E shard $MATRIX_SHARD/$E2E_SHARD_COUNT took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

  test-e2e-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test background runtime E2E
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:system --reporter=minimal
          test_status=$?
          set -e
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "Background runtime E2E took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"
        env:
          CI: true

  test-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.0'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: test/conformance/fixtures/python/uv.lock

      - name: Sync frozen Python fixture
        working-directory: test/conformance/fixtures/python
        run: uv sync --frozen

      - name: Install frozen TypeScript peer fixtures
        working-directory: test/conformance/fixtures/typescript
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Resolve checked-out source SHA
        id: conformance-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run no-retry conformance baseline and focused transports
        run: pnpm test:conformance -- --reporter=minimal
        env:
          CI: true
          GITHUB_SHA: ${{ steps.conformance-source.outputs.sha }}

      - name: Upload exact-source conformance evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: conformance-${{ steps.conformance-source.outputs.sha }}
          path: |
            .tmp/conformance/conformance-baseline.json
            .tmp/conformance/conformance-integrity.json
            .tmp/conformance/observed-inputs.json
            .tmp/conformance/profile-proofs.json
            .tmp/conformance/profile-evidence/
            .tmp/conformance/legacy-revisions/
            .tmp/conformance/official-evidence/
            .tmp/conformance/evidence/
          if-no-files-found: error

  test-e2e-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type != 'tag'
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Test browser E2E
        run: |
          started_at=$(date +%s)
          set +e
          pnpm test:e2e:browser --reporter=minimal
          test_status=$?
          set -e
          finished_at=$(date +%s)
          duration=$((finished_at - started_at))
          echo "Browser E2E took ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"
        env:
          CI: true
