name: Deploy Documentation

on:
  # Trigger on pushes to main branch
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - '.github/workflows/deploy-documentation.yml'
      - '.github/actions/setup-node-pnpm/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/validate-docs-seo.mjs'
      - 'src/config/projectConfigTypes.ts'
      - 'src/core/types/**'
      - 'src/constants/schema.ts'
    tags:
      - 'v*'

  # Allow manual triggering
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with VitePress
        run: |
          pnpm docs:build
          touch docs/site/.vitepress/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/.vitepress/dist

  # Deployment job
  deploy_gh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy_cf:
    environment:
      name: cloudflare-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download github pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
      - name: Extract files
        run: |
          mkdir public
          tar -xvf artifact.tar -C public
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: |
            pages project list
            pages deploy public --project-name=${{ secrets.CF_PROJECT_NAME }} --branch=main
