name: Docker

on:
  workflow_call:
    inputs:
      release_ref:
        description: Branch to build Docker images from.
        required: true
        type: string
      release_sha:
        description: Exact release commit SHA to build from.
        required: true
        type: string
      version:
        description: Release version being built.
        required: true
        type: string
      version_tag:
        description: Release tag name.
        required: true
        type: string
      docker_raw_tag:
        description: Raw Docker tag for the extended image.
        required: true
        type: string
      is_prerelease:
        description: Whether the release is a prerelease.
        required: true
        type: boolean
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: docker (${{ matrix.target }}, ${{ matrix.platform_name }})
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: basic
            platform: linux/amd64
            platform_name: amd64
            runner: ubuntu-latest
            suffix: -lite
            raw_tag: lite
          - target: extended
            platform: linux/amd64
            platform_name: amd64
            runner: ubuntu-latest
            suffix: ''
            raw_tag: latest
          - target: basic
            platform: linux/arm64
            platform_name: arm64
            runner: ubuntu-24.04-arm
            suffix: -lite
            raw_tag: lite
          - target: extended
            platform: linux/arm64
            platform_name: arm64
            runner: ubuntu-24.04-arm
            suffix: ''
            raw_tag: latest

    steps:
      - name: Validate release ref
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          VERSION_TAG: ${{ inputs.version_tag }}
          DOCKER_RAW_TAG: ${{ inputs.docker_raw_tag }}
          IS_PRERELEASE: ${{ inputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "main" && ! "$RELEASE_REF" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release ref: $RELEASE_REF"
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release SHA: $RELEASE_SHA"
            exit 1
          fi
          VERSION_TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$VERSION_TAG" =~ $VERSION_TAG_REGEX ]]; then
            PRERELEASE_CHANNEL="${BASH_REMATCH[2]:-}"
          else
            echo "::error::Invalid release tag: $VERSION_TAG"
            exit 1
          fi
          if [[ "$VERSION_TAG" != "v${VERSION}" ]]; then
            echo "::error::Release version and tag do not match: $VERSION / $VERSION_TAG"
            exit 1
          fi
          if [[ "$DOCKER_RAW_TAG" != "latest" && ! "$DOCKER_RAW_TAG" =~ ^[A-Za-z][0-9A-Za-z-]*$ ]]; then
            echo "::error::Invalid Docker raw tag: $DOCKER_RAW_TAG"
            exit 1
          fi
          if [[ -n "$PRERELEASE_CHANNEL" && "$IS_PRERELEASE" != "true" ]]; then
            echo "::error::Prerelease tags must set is_prerelease=true"
            exit 1
          fi
          if [[ -z "$PRERELEASE_CHANNEL" && "$IS_PRERELEASE" == "true" ]]; then
            echo "::error::Stable release tags must set is_prerelease=false"
            exit 1
          fi
          if [[ -n "$PRERELEASE_CHANNEL" && "$DOCKER_RAW_TAG" != "$PRERELEASE_CHANNEL" ]]; then
            echo "::error::Prerelease builds must use docker_raw_tag=$PRERELEASE_CHANNEL"
            exit 1
          fi
          if [[ -z "$PRERELEASE_CHANNEL" && "$DOCKER_RAW_TAG" != "latest" ]]; then
            echo "::error::Stable builds must use docker_raw_tag=latest"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version_tag }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Check candidate source and version
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-artifacts.cjs candidate

      - name: Read Node.js version
        id: node-version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            NODE_VERSION=${{ steps.node-version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform_name }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false

      - name: Smoke the retained platform digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$BUILD_DIGEST"
          observed=$(docker run --rm "$IMAGE@$BUILD_DIGEST" node index.js --version)
          test "$observed" = "$VERSION"

      - name: Export tested Docker identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          ARTIFACT_KIND: oci-${{ matrix.target }}-${{ matrix.platform_name }}
        run: node scripts/release-artifacts.cjs record-digest docker-metadata

      - name: Upload Docker metadata
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.target }}-${{ matrix.platform_name }}
          path: docker-metadata
          if-no-files-found: error
          retention-days: 30
