name: Release

on:
  workflow_call:
    inputs:
      release_ref:
        description: Branch to publish the npm package from.
        required: true
        type: string
      release_sha:
        description: Exact release commit SHA to publish from.
        required: true
        type: string
      version:
        description: Release version to publish.
        required: true
        type: string
      version_tag:
        description: Release tag name.
        required: true
        type: string
      npm_tag:
        description: npm dist-tag to publish.
        required: true
        type: string
      is_prerelease:
        description: Whether the release is a prerelease.
        required: true
        type: boolean

      artifact_run_id:
        description: Original run retaining the tested candidate artifacts.
        required: true
        type: string
      recovery:
        description: Explicit owner resumption of verified missing publications.
        required: true
        type: boolean
      approval_ref:
        required: true
        type: string
      readiness_ref:
        required: true
        type: string

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-deps: 'false'
      - name: Use npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Validate retained candidate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          READINESS_REF: ${{ inputs.readiness_ref }}
        run: |
          node scripts/release-artifacts.cjs candidate
          node scripts/release-recovery.cjs validate
      - name: Download tested npm archive
        uses: actions/download-artifact@v8
        with:
          name: npm-candidate
          path: artifacts/npm
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download tested SEA archives
        uses: actions/download-artifact@v8
        with:
          pattern: 1mcp-*-*
          path: artifacts/binaries
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download tested OCI digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-*
          path: artifacts/docker
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Resolve release changelog range
        id: release-notes-range
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/resolve-release-notes-range.cjs "$VERSION_TAG" "$RELEASE_SHA"

      - name: Generate release changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff-release.toml
          args: --tag ${{ inputs.version_tag }} --strip header ${{ steps.release-notes-range.outputs.tag_filter_args }} ${{ steps.release-notes-range.outputs.range }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Finalize release changelog
        id: release-notes
        env:
          GIT_CLIFF_OUTPUT: ${{ steps.git-cliff.outputs.changelog }}
          VERSION_TAG: ${{ inputs.version_tag }}
          PREVIOUS_TAG: ${{ steps.release-notes-range.outputs.previous_tag }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail

          node scripts/finalize-release-notes.cjs "$GIT_CLIFF_OUTPUT" release-notes.md "$VERSION_TAG" "$PREVIOUS_TAG" "$NPM_TAG"
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish missing versioned identities and read back all required publications
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
          RECOVERY: ${{ inputs.recovery }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA="$RELEASE_SHA"
          export GITHUB_REF="refs/heads/$RELEASE_REF"
          node scripts/release-publications.cjs versions
      - name: Retain publication outcomes even on partial failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: versioned-publication-state
          path: publication-state.json
          retention-days: 30
          if-no-files-found: warn

  promote:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-deps: 'false'
      - name: Use npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: versioned-publication-state
      - uses: actions/download-artifact@v8
        with:
          name: npm-candidate
          path: artifacts/npm
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: 1mcp-*-*
          path: artifacts/binaries
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-*
          path: artifacts/docker
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Reverify versioned identities then promote channel aliases without rebuilding
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
          RECOVERY: ${{ inputs.recovery }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publications.cjs promote
      - name: Retain alias outcomes even on partial failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alias-publication-state
          path: publication-state.json
          retention-days: 30
          if-no-files-found: warn
