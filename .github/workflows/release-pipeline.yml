name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'New release source: main or release-<major>.<minor>. Recovery derives its source.'
        required: false
        default: main
        type: string
      version:
        description: 'New release version: X.Y.Z or X.Y.Z-<prerelease>. Leave empty for recovery.'
        required: false
        type: string

      recovery_run_id:
        description: 'Explicit owner resume: original Release Pipeline run ID; empty for new release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.recovery_run_id || inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      artifact_run_id: ${{ steps.validate.outputs.artifact_run_id }}
      version: ${{ steps.validate.outputs.version }}
      version_tag: ${{ steps.validate.outputs.version_tag }}
      release_ref: ${{ steps.validate.outputs.release_ref }}
      expected_release_branch: ${{ steps.validate.outputs.expected_release_branch }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      npm_tag: ${{ steps.validate.outputs.npm_tag }}
      docker_raw_tag: ${{ steps.validate.outputs.docker_raw_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs
        id: validate
        run: |
          node scripts/release-recovery.cjs validate
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          VERSION: ${{ inputs.version }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          GH_TOKEN: ${{ github.token }}

  update-version:
    needs: validate
    if: inputs.recovery_run_id == ''
    uses: ./.github/workflows/update-version.yml
    with:
      release_ref: ${{ needs.validate.outputs.release_ref }}
      version: ${{ needs.validate.outputs.version }}
    permissions:
      contents: write

  candidate:
    needs: [validate, update-version]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.update-version.result == 'success' || inputs.recovery_run_id != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
      artifact_run_id: ${{ steps.identity.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the resolver from the dispatch revision before checking out candidate code.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact candidate and owner-selected recovery run
        id: identity
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha || needs.update-version.outputs.release_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
          ARTIFACT_RUN_ID: ${{ needs.validate.outputs.artifact_run_id }}
        run: node scripts/release-recovery.cjs candidate

  ci:
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    uses: ./.github/workflows/test-and-validate.yml
    with:
      checkout_ref: ${{ needs.candidate.outputs.release_sha }}
      release_gate: true
    permissions:
      contents: read

  native-security:
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    uses: ./.github/workflows/native-credentials.yml
    with:
      checkout_ref: ${{ needs.candidate.outputs.release_sha }}
    permissions:
      contents: read

  package:
    needs: [validate, candidate, ci, native-security]
    if: inputs.recovery_run_id == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.release_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-deps: 'false'
      - name: Build, pack, install and smoke retained npm archive
        env:
          RELEASE_SHA: ${{ needs.candidate.outputs.release_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_KIND: npm
        run: |
          set -euo pipefail
          node scripts/release-artifacts.cjs candidate
          pnpm build
          npm pkg set "gitHead=$RELEASE_SHA"
          mkdir -p npm-artifact
          npm pack --ignore-scripts --pack-destination npm-artifact
          npm install --prefix "$RUNNER_TEMP/npm-smoke" ./npm-artifact/*.tgz --ignore-scripts --omit=dev --no-audit --no-fund
          observed=$("$RUNNER_TEMP/npm-smoke/node_modules/.bin/1mcp" --version)
          test "$observed" = "$VERSION"
          node scripts/release-artifacts.cjs record npm-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: npm-candidate
          path: npm-artifact
          retention-days: 30
          if-no-files-found: error

  binaries:
    needs: [validate, candidate, ci, native-security]
    if: inputs.recovery_run_id == ''
    uses: ./.github/workflows/build-binaries.yml
    with:
      release_ref: ${{ needs.validate.outputs.release_ref }}
      release_sha: ${{ needs.candidate.outputs.release_sha }}
      version: ${{ needs.validate.outputs.version }}
      version_tag: ${{ needs.validate.outputs.version_tag }}
    permissions:
      contents: write

  docker:
    needs: [validate, candidate, ci, native-security]
    if: inputs.recovery_run_id == ''
    uses: ./.github/workflows/build-docker-images.yml
    with:
      release_ref: ${{ needs.validate.outputs.release_ref }}
      release_sha: ${{ needs.candidate.outputs.release_sha }}
      version: ${{ needs.validate.outputs.version }}
      version_tag: ${{ needs.validate.outputs.version_tag }}
      docker_raw_tag: ${{ needs.validate.outputs.docker_raw_tag }}
      is_prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
    permissions:
      contents: read
      packages: write
      security-events: write

  # Publishes to npm and creates the GitHub Release (which creates the git tag).
  # Runs after binaries (artifacts attached to the release) and docker (so we don't
  # tag a release whose images failed to publish).
  release:
    needs: [validate, candidate, ci, native-security, package, binaries, docker]
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.native-security.result == 'success' && (inputs.recovery_run_id != '' || (needs.package.result == 'success' && needs.binaries.result == 'success' && needs.docker.result == 'success')) }}
    uses: ./.github/workflows/publish-to-npm.yml
    with:
      release_ref: ${{ needs.validate.outputs.release_ref }}
      release_sha: ${{ needs.candidate.outputs.release_sha }}
      version: ${{ needs.validate.outputs.version }}
      version_tag: ${{ needs.validate.outputs.version_tag }}
      npm_tag: ${{ needs.validate.outputs.npm_tag }}
      artifact_run_id: ${{ needs.candidate.outputs.artifact_run_id }}
      recovery: ${{ inputs.recovery_run_id != '' }}
      is_prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: read

  # Cuts the release-X.Y maintenance branch only after npm + docker + GitHub
  # release all succeeded. Skipped for releases that already ran from a
  # release-X.Y branch.
  finalize:
    needs: [validate, candidate, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.validate.outputs.release_ref == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch
        env:
          RELEASE_SHA: ${{ needs.candidate.outputs.release_sha }}
          EXPECTED_RELEASE_BRANCH: ${{ needs.validate.outputs.expected_release_branch }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/${EXPECTED_RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "${EXPECTED_RELEASE_BRANCH} already exists; not creating it."
            exit 0
          fi

          if ! git push origin "${RELEASE_SHA}:refs/heads/${EXPECTED_RELEASE_BRANCH}"; then
            if git ls-remote --exit-code --heads origin "refs/heads/${EXPECTED_RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "${EXPECTED_RELEASE_BRANCH} was created concurrently; treating as success."
              exit 0
            fi

            echo "::error::Failed to create ${EXPECTED_RELEASE_BRANCH}."
            exit 1
          fi
          echo "Created ${EXPECTED_RELEASE_BRANCH} at ${RELEASE_SHA}."

  summary:
    if: always()
    needs: [validate, update-version, candidate, ci, native-security, package, binaries, docker, release, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      github_verified: ${{ steps.summary.outputs.github_verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the summary schema current even when releasing an older maintenance branch.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect exact-source gate evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-gates
          path: summary-evidence/gates
      - name: Collect partial publication and alias evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: '*publication-state'
          path: summary-evidence
      - name: Collect retained npm identity
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: npm-candidate
          path: summary-evidence/npm
          run-id: ${{ needs.candidate.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Collect retained binary identities
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: 1mcp-*-*
          path: summary-evidence/binaries
          run-id: ${{ needs.candidate.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Collect retained OCI identities
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: docker-*
          path: summary-evidence/docker
          run-id: ${{ needs.candidate.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Write compact truthful release summary
        id: summary
        if: always()
        env:
          RELEASE_SHA: ${{ needs.candidate.outputs.release_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
          NPM_TAG: ${{ needs.validate.outputs.npm_tag }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          ARTIFACT_RUN_ID: ${{ needs.candidate.outputs.artifact_run_id }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-summary.cjs
      - name: Retain summary even after partial failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-summary
          path: release-summary.json
          retention-days: 30
          if-no-files-found: error

  attach-summary:
    if: ${{ always() && needs.summary.result == 'success' && needs.summary.outputs.github_verified == 'true' }}
    needs: [candidate, summary]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-summary
      - name: Attach evidence to the verified release under the existing protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/attach-release-summary.cjs
