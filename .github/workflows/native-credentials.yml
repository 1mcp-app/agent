name: Native OAuth credentials

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-credentials-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: ${{ !inputs.checkout_ref }}

env:
  HUSKY: 0
  CI: true

jobs:
  native:
    name: Native store / ${{ matrix.os }} / Node and SEA
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: 1mcp
          - os: macos-latest
            binary: 1mcp
          - os: windows-latest
            binary: 1mcp.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-deps: ${{ !inputs.checkout_ref }}
      - name: Install checksum-pinned native helper fixture
        shell: bash
        run: |
          node scripts/security/install-native-test-helper.mjs "$RUNNER_TEMP/native-helper-bin"
          echo "$RUNNER_TEMP/native-helper-bin" >> "$GITHUB_PATH"
      - name: Install Linux Secret Service fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11
      - name: Create disposable macOS test Keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          security create-keychain -p fixture-only "$RUNNER_TEMP/1mcp-native.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/1mcp-native.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/1mcp-native.keychain-db"
          security unlock-keychain -p fixture-only "$RUNNER_TEMP/1mcp-native.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/1mcp-native.keychain-db"
      - name: Build Node installation
        shell: bash
        run: bash scripts/build.sh
      - name: Verify Product Usage state and local controls with Windows Node
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-product-telemetry-state.mjs --out "$RUNNER_TEMP/product-state-node.json"
      - name: Verify private CLI artifact ACLs with Windows Node
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-stdout-artifact-privacy.mjs --out "$RUNNER_TEMP/cli-artifact-privacy.json"
      - name: Upload Windows CLI artifact privacy evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: cli-artifact-windows-acceptance
          path: ${{ runner.temp }}/cli-artifact-privacy.json
          if-no-files-found: warn
      - name: Verify real native store with Node
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash <<'NATIVE_SMOKE'
          set -e
          printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          node scripts/security/native-credential-store-smoke.mjs --allow-native-write
          node scripts/security/upstream-credential-store-smoke.mjs --allow-native-write
          node scripts/security/inbound-credential-store-smoke.mjs --allow-native-write
          NATIVE_SMOKE
          else
            node scripts/security/native-credential-store-smoke.mjs --allow-native-write
            node scripts/security/upstream-credential-store-smoke.mjs --allow-native-write
            node scripts/security/inbound-credential-store-smoke.mjs --allow-native-write
          fi
      - name: Build SEA distribution
        run: pnpm sea:build
      - name: Build packaged executable
        run: pnpm sea:binary
      - name: Restore compiled Node fixtures
        shell: bash
        run: bash scripts/build.sh
      - name: Verify Product Usage state and local controls with Windows SEA
        if: runner.os == 'Windows'
        shell: bash
        env:
          PRODUCT_TEST_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: node scripts/verify-product-telemetry-state.mjs --binary "$PRODUCT_TEST_BINARY" --out "$RUNNER_TEMP/product-state-sea.json"
      - name: Verify synthetic Windows Node and SEA background delivery
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-product-telemetry-delivery.mjs --sea --out "$RUNNER_TEMP/product-delivery.json"
      - name: Upload Windows Product Usage acceptance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: product-usage-windows-acceptance
          path: ${{ runner.temp }}/product-*.json
          if-no-files-found: warn
      - name: Verify real native store with packaged executable
        shell: bash
        env:
          NATIVE_TEST_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- bash <<'NATIVE_SMOKE'
          set -e
          printf "\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          node scripts/security/upstream-credential-store-smoke.mjs --allow-native-write --binary "$NATIVE_TEST_BINARY"
          node scripts/security/inbound-credential-store-smoke.mjs --allow-native-write --binary "$NATIVE_TEST_BINARY"
          NATIVE_SMOKE
          else
            node scripts/security/upstream-credential-store-smoke.mjs --allow-native-write --binary "$NATIVE_TEST_BINARY"
            node scripts/security/inbound-credential-store-smoke.mjs --allow-native-write --binary "$NATIVE_TEST_BINARY"
          fi
